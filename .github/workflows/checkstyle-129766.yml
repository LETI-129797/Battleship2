name: Checkstyle gate 129766

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  checkstyle:
    name: Checkstyle gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: ./checkstyle-129766.xml
          reporter: github-pr-check
          level: error
          filter_mode: added
          fail_level: error