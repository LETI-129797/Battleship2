name: Qodana smell gate (Long Parameter List) 129797
on:
  pull_request:
  push:
    branches: [main,LETI-129797]
  workflow_dispatch:
jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          args: --config,qodana-129797.yaml