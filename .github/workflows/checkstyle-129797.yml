name: Checkstyle gate 129797

on:
  pull_request:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  checkstyle:
    name: Checkstyle - ParameterName
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dbelyaev/action-checkstyle@v3
        with:
          checkstyle_config: ./checkstyle-129797.xml
          reporter: github-pr-check
          level: error
          filter_mode: added
          fail_level: error
