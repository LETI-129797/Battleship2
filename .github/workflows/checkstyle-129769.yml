name: Checkstyle 129769

on:
  pull_request:
    branches:
      - master

permissions: {}

jobs:
  checkstyle:
    name: Checkstyle - ConstantName
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Checkstyle
        uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-129769.xml
          reporter: github-pr-check
          level: error
          filter_mode: added
          fail_level: error