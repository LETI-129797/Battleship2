
# 129769 - Tiago Miguel Gomes Ribeiro
name: Qodana smell gate 129769

on:
  pull_request:
  push:
    branches: [master, LETI-129769]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129769.yaml --profile-path qodana/profiles/large-class-129769.yaml
          use-annotations: true
          post-pr-comment: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
