version: "1.0"

profile:
  base:
    name: empty

  inspections:
    # Inspeção principal: métodos demasiado longos
    - inspection: OverlyLongMethod
      enabled: true
      severity: WARNING
      options:
        m_limit: 20

    # Métodos com demasiada complexidade ciclomática
    - inspection: OverlyComplexMethod
      enabled: true
      severity: WARNING
      options:
        m_limit: 10

    # Métodos com demasiados parâmetros
    - inspection: MethodWithTooManyParameters
      enabled: true
      severity: WARNING
      options:
        m_limit: 5